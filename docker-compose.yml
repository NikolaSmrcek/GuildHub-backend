version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: guildhub-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-guildhub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-guildhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: guildhub-backend
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-guildhub}
      PORT: ${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
